openapi: 3.0.0
info:
  title: 'Volunteer API'
  description: 'API для волонтёрского приложения. Управление пользователями, задачами, проектами и чатами.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8080'
    description: 'Локальный сервер'
paths:
  /api/users/register:
    post:
      summary: 'Регистрация нового пользователя'
      description: 'Регистрация нового пользователя'
      operationId: 47e06fdfd6ab0b18a9ffc397ca635db1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - full_name
                - password
                - confirm
              properties:
                full_name:
                  type: string
                  example: 'Иван Иванов'
                phone:
                  type: string
                  example: '+79001234567'
                email:
                  type: string
                  format: email
                  example: ivan@example.com
                password:
                  type: string
                  format: password
                  example: secret
                confirm:
                  type: string
                  format: password
                  example: secret
                city:
                  type: string
                  example: Пермь
                birth_date:
                  type: string
                  format: date
                  example: '2000-05-15'
                about:
                  type: string
                  example: 'О себе'
              type: object
      responses:
        '200':
          description: 'Успешная регистрация'
          content:
            application/json:
              schema:
                properties:
                  result: { type: string, example: successful }
                type: object
        '400':
          description: 'Ошибка валидации (не все параметры, пароли не совпадают, неверный формат)'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
        '409':
          description: 'Пользователь с таким телефоном или email уже существует'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
  /api/users/signin:
    post:
      summary: 'Авторизация пользователя'
      description: 'Вход в систему'
      operationId: 8c184fcd72da7f37a7b0cc8df180627a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - login
                - password
              properties:
                login:
                  description: 'Телефон или email'
                  type: string
                  example: '+79001234567'
                password:
                  type: string
                  format: password
                  example: secret
              type: object
      responses:
        '200':
          description: 'Успешный вход. В cookie устанавливается JWT, в теле возвращаются данные пользователя'
          content:
            application/json:
              schema:
                properties:
                  success: { properties: { id: { type: integer }, phone: { type: string, nullable: true }, email: { type: string, nullable: true }, full_name: { type: string } }, type: object }
                type: object
        '400':
          description: 'Неверный логин/пароль или отсутствуют параметры'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
  /api/users/me:
    get:
      summary: 'Получить данные текущего авторизованного пользователя'
      description: 'Получение профиля текущего пользователя'
      operationId: 74bb8bf4003ecfe752ba8903ce7313f8
      responses:
        '200':
          description: 'Данные профиля'
          content:
            application/json:
              schema:
                properties:
                  id: { type: integer }
                  full_name: { type: string }
                  phone: { type: string, nullable: true }
                  email: { type: string, nullable: true }
                  city: { type: string, nullable: true }
                  birth_date: { type: string, format: date, nullable: true }
                  about: { type: string, nullable: true }
                  profile_picture: { type: string, nullable: true }
                  vk_id: { type: string, nullable: true }
                  tg_id: { type: string, nullable: true }
                  balance: { type: number, format: float }
                  availability_status: { type: string, enum: [available, busy, offline] }
                  is_admin: { type: boolean }
                  is_moderator: { type: boolean }
                  last_seen_at: { type: string, format: date-time, nullable: true }
                  is_online: { type: boolean }
                  average_rating: { type: number, format: float }
                  created_at: { type: string, format: date-time }
                  updated_at: { type: string, format: date-time }
                type: object
        '401':
          description: 'Не авторизован'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
        '404':
          description: 'Пользователь не найден'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
      security:
        -
          cookieAuth: []
  '/api/users/{id}':
    get:
      summary: 'Получить публичные данные пользователя по ID'
      description: 'Получение публичной информации о пользователе по ID'
      operationId: a68ec55d74b7048a5bbd7d2a1f48f9e4
      parameters:
        -
          name: id
          in: path
          description: 'ID пользователя'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Публичные данные пользователя'
          content:
            application/json:
              schema:
                properties:
                  id: { type: integer }
                  full_name: { type: string }
                  city: { type: string, nullable: true }
                  birth_date: { type: string, format: date, nullable: true }
                  about: { type: string, nullable: true }
                  profile_picture: { type: string, nullable: true }
                  availability_status: { type: string, enum: [available, busy, offline] }
                  average_rating: { type: number, format: float }
                  last_seen_at: { type: string, format: date-time, nullable: true }
                  is_online: { type: boolean }
                type: object
        '400':
          description: 'ID не передан'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
        '404':
          description: 'Пользователь не найден'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
    delete:
      summary: 'Удаление профиля по ID (только для самого пользователя)'
      description: 'Удаление профиля по ID (только свой)'
      operationId: 044a8ceac6675e1463a0f70298899438
      parameters:
        -
          name: id
          in: path
          description: 'ID пользователя'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Профиль удалён'
          content:
            application/json:
              schema:
                properties:
                  result: { type: string, example: successful }
                type: object
        '400':
          description: 'ID не передан'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
        '401':
          description: 'Не авторизован'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
        '403':
          description: 'Попытка удалить чужой профиль'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
        '404':
          description: 'Пользователь не найден'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
      security:
        -
          cookieAuth: []
  /api/users:
    put:
      summary: 'Редактирование профиля текущего пользователя'
      description: 'Редактирование профиля'
      operationId: b599fd8a8b161043992f138ab9c580d4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                full_name:
                  type: string
                  example: 'Пётр Петров'
                phone:
                  type: string
                  example: '+79007654321'
                email:
                  type: string
                  format: email
                  example: petr@example.com
                city:
                  type: string
                  example: Москва
                birth_date:
                  type: string
                  format: date
                  example: '1995-03-20'
                about:
                  type: string
                  example: 'Новый текст о себе'
                profile_picture:
                  type: string
                  example: 'https://example.com/avatar.jpg'
                availability_status:
                  type: string
                  enum: [available, busy, offline]
              type: object
      responses:
        '200':
          description: 'Профиль обновлён'
          content:
            application/json:
              schema:
                properties:
                  result: { type: string, example: successful }
                type: object
        '400':
          description: 'Ошибка валидации (неверный формат, занятый телефон/email и т.д.)'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
        '401':
          description: 'Не авторизован'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
        '404':
          description: 'Пользователь не найден'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
        '409':
          description: 'Телефон или email уже заняты'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
      security:
        -
          cookieAuth: []
    delete:
      summary: 'Удаление профиля текущего пользователя'
      description: 'Удаление своего профиля'
      operationId: e6000b290151db83f7c7f7208fcf50b9
      responses:
        '200':
          description: 'Профиль удалён'
          content:
            application/json:
              schema:
                properties:
                  result: { type: string, example: successful }
                type: object
        '401':
          description: 'Не авторизован'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
        '404':
          description: 'Пользователь не найден'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
      security:
        -
          cookieAuth: []
  /api/users/password:
    put:
      summary: 'Смена пароля текущего пользователя'
      description: 'Смена пароля'
      operationId: 7d75f0cf8e1e14a0ed0c7bd00e2a0359
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - old
                - new
                - confirm
              properties:
                old:
                  type: string
                  format: password
                  example: oldpass
                new:
                  type: string
                  format: password
                  example: newpass
                confirm:
                  type: string
                  format: password
                  example: newpass
              type: object
      responses:
        '200':
          description: 'Пароль изменён'
          content:
            application/json:
              schema:
                properties:
                  result: { type: string, example: successful }
                type: object
        '400':
          description: 'Не все поля, не совпадают, неверный старый пароль'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
        '401':
          description: 'Не авторизован'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
        '404':
          description: 'Пользователь не найден'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                type: object
      security:
        -
          cookieAuth: []
  /api/users/logout:
    post:
      summary: 'Выход из системы (удаление сессии и cookie)'
      description: 'Выход из системы'
      operationId: d58dc4ade69787581dbc405ea7f56741
      responses:
        '200':
          description: 'Успешный выход'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                type: object
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      description: 'Аутентификация через JWT в cookie (HttpOnly)'
      name: jwt
      in: cookie
